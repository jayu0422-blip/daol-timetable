<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027 개강 의향</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{
  --c-mine:#1a2747; --c-mine-ink:#ffffff; --c-fix:#dce6f5; --c-fix-line:#5f7fb5; --c-tent:#c27a1a; --c-tent-bg:#fff7ea;
  --ground:#f4f2ec; --surface:#ffffff; --raise:#fbfaf7; --ink:#141c33; --ink2:#5a6278; --ink3:#8b91a1; --line:#e3ded2; --line2:#efebe2;
  --navy:#1a2747; --navy2:#26375f; --on-navy:#f3efe4; --brass:#9c7a3c; --brass-soft:#f3ecdc;
  --ok:#1e7348; --ok-bg:#e4f2ea; --warn:#9a5a00; --warn-bg:#fbf0dc; --talk:#b0351f; --talk-bg:#fbe7e2;
  --gold:var(--brass); --gold-soft:var(--brass-soft);
  --shadow:0 1px 2px rgba(20,28,51,.05),0 8px 24px -12px rgba(20,28,51,.18);
  --f-body:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,-apple-system,sans-serif; --f-title:var(--f-body);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0f131c; --surface:#171d2a; --raise:#1c2333; --ink:#e9ecf3; --ink2:#a6adbf; --ink3:#7a8297; --line:#2b3346; --line2:#232a3a;
  --navy:#c9d5f2; --navy2:#aebfe8; --on-navy:#0f131c; --brass:#d6b26c; --brass-soft:#2b2516;
  --ok:#86d3a9; --ok-bg:#15301f; --warn:#f0bd6a; --warn-bg:#33270f; --talk:#f29a8b; --talk-bg:#3a1c17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{
  --ground:#0f131c; --surface:#171d2a; --raise:#1c2333; --ink:#e9ecf3; --ink2:#a6adbf; --ink3:#7a8297; --line:#2b3346; --line2:#232a3a;
  --navy:#c9d5f2; --navy2:#aebfe8; --on-navy:#0f131c; --brass:#d6b26c; --brass-soft:#2b2516;
  --ok:#86d3a9; --ok-bg:#15301f; --warn:#f0bd6a; --warn-bg:#33270f; --talk:#f29a8b; --talk-bg:#3a1c17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--ground);color:var(--ink);font:15.5px/1.7 var(--f-body);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 120px}
.wrap.wide{max-width:1240px;padding-top:20px}
h1{font-family:var(--f-title);font-size:30px;font-weight:800;line-height:1.25;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:17px;margin:0;color:var(--ink);letter-spacing:-.01em}
h3{font-size:14.5px;margin:18px 0 6px}
.eyebrow{font-size:11.5px;letter-spacing:.16em;color:var(--brass);font-weight:700;text-transform:uppercase}
.muted{color:var(--ink2);font-size:13.5px}
.note{font-size:12.5px;color:var(--ink2);margin-top:2px}

/* 머리 띠 */
.hero{margin:0 -16px;padding:28px 16px 30px;background:var(--navy);color:var(--on-navy);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;border:1px solid color-mix(in srgb,var(--on-navy) 14%,transparent);box-shadow:0 0 0 40px color-mix(in srgb,var(--on-navy) 4%,transparent)}
.hero-in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;position:relative;z-index:1}
.hero .eyebrow{color:color-mix(in srgb,var(--brass) 70%,var(--on-navy))}
.hero h1{color:var(--on-navy)}
.hero .lead{margin:6px 0 0;font-size:14px;color:color-mix(in srgb,var(--on-navy) 75%,transparent)}
.due{margin-left:auto;display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--on-navy) 10%,transparent);border:1px solid color-mix(in srgb,var(--on-navy) 22%,transparent);border-radius:14px;padding:10px 14px}
.due b{font-family:var(--f-title);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.due span{font-size:12.5px;line-height:1.35}

/* 단계 표시 */
.stepper{position:sticky;top:0;z-index:20;margin:0 -16px;padding:10px 16px;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.stepper-in{max-width:1240px;margin:0 auto;display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none}
.step{flex:none;height:36px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink2);font-size:13px;font-weight:600;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.step{line-height:1}.step i{line-height:1;font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--line2);color:var(--ink2)}
.step small{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.step.fin{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.step.fin i{background:var(--ok);color:var(--surface)}
.step.now{color:var(--ink);border-color:var(--navy)}
.step.now i{background:var(--navy);color:var(--surface)}
.stepper .bar-pct{margin-left:auto;flex:none;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}

/* 두 단 배치 */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin-top:18px}
@media (min-width:1100px){.layout{grid-template-columns:minmax(0,1fr) 460px;align-items:start}.side{position:sticky;top:72px;max-height:calc(100vh - 88px);overflow:auto;scrollbar-width:thin}}
.side .card{margin-top:0}

/* 카드·섹션 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 22px;margin-top:16px;box-shadow:var(--shadow)}
.main > .card:first-child{margin-top:0}
.sechead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.sechead .num{font-family:var(--f-title);font-size:28px;line-height:1;color:var(--brass);min-width:22px}
.sechead .meta{margin-left:auto;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.sechead + .muted{margin:0 0 4px}

/* 공통 메시지 */
.letter{padding:0;overflow:hidden}
.letter > summary{list-style:none;cursor:pointer;display:block;padding:18px 22px;border-bottom:1px solid transparent}
.sum-row{display:flex;align-items:center;gap:12px}
.letter[open] > summary{border-bottom-color:var(--line2)}
.letter > summary::-webkit-details-marker{display:none}
.letter .sum-row .num{font-family:var(--f-title);font-size:28px;line-height:1;color:var(--brass)}
.letter .sum-row .tog{margin-left:auto;font-size:12.5px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.letter .body{padding:6px 26px 24px;border-left:3px solid var(--brass);margin:16px 22px 22px;background:var(--raise);border-radius:0 12px 12px 0;max-width:72ch}
.letter p{margin:12px 0}
.letter ul,.letter ol{margin:6px 0 12px;padding-left:20px}
.letter li{margin:6px 0}
.letter li::marker{color:var(--brass)}
.letter .sec{font-family:var(--f-title);font-weight:700;font-size:17px;color:var(--ink);margin:22px 0 4px}
.letter .sig{text-align:right;font-family:var(--f-title);font-size:15px;color:var(--ink2);margin-top:18px}

/* 확인 체크 */
.ack label,.agree{display:flex;gap:12px;align-items:flex-start;padding:14px 4px;border-top:1px solid var(--line2);cursor:pointer;line-height:1.6}
.ack label:first-of-type{border-top:0}
.ack input,.agree input{appearance:none;width:22px;height:22px;margin-top:2px;flex:none;border:1.5px solid var(--ink3);border-radius:6px;background:var(--surface);display:grid;place-items:center;cursor:pointer}
.ack input:checked,.agree input:checked{background:var(--navy);border-color:var(--navy)}
.ack input:checked::after,.agree input:checked::after{content:"";width:10px;height:6px;border:2px solid var(--surface);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.ack label:has(input:checked) span,.agree:has(input:checked) span{color:var(--ink2)}
.agree{margin-top:14px}

/* 반 카드 */
.grp{margin:26px 0 2px;font-size:12px;font-weight:700;color:var(--brass);letter-spacing:.08em}
.grp + .note{margin-bottom:4px}
.cls{border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin-top:12px;background:var(--surface);transition:border-color .15s, box-shadow .15s}
.cls:hover{border-color:color-mix(in srgb,var(--navy) 30%,var(--line))}
.cls.answered{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.cls .hd{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.cls .nm{font-weight:700;font-size:16.5px;letter-spacing:-.01em}
.cls .tm{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13.5px;margin-top:4px}
.cls .tm svg{flex:none;opacity:.7}
.chip{margin-left:auto;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.chip[hidden]{display:none}
/* 학생·학부모 화면 샘플 (실제 포털 캡처) */
.shots{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(300px,340px);gap:16px;overflow-x:auto;padding:6px 2px 12px;margin-top:12px;scroll-snap-type:x mandatory}
.shot{margin:0;scroll-snap-align:start;display:flex;flex-direction:column;gap:10px}
.shot-frame{border:8px solid #11172a;border-radius:26px;overflow:hidden;background:#fff;height:660px;overflow-y:auto;box-shadow:0 14px 30px -18px rgba(17,23,42,.6)}
.shot-frame img{display:block;width:100%;height:auto}
.shot figcaption{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--ink2)}
.shot figcaption b{font-size:14px;color:var(--ink)}
.dev-note{margin-top:14px;display:flex;flex-direction:column;gap:4px;background:var(--brass-soft);border-left:3px solid var(--brass);border-radius:4px 12px 12px 4px;padding:12px 14px;font-size:13.5px;line-height:1.6}
.dev-note b{color:var(--ink)}

.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.need{background:var(--warn-bg);color:var(--warn)} .chip.wait{background:var(--line2);color:var(--ink2)} .chip.bad{background:var(--talk-bg);color:var(--talk)}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--brass-soft);color:var(--brass);letter-spacing:.02em}
.tag.ok{background:var(--ok-bg);color:var(--ok)}

/* 선택 버튼(세그먼트) */
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.opts.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:4px;padding:4px;border-radius:12px;background:var(--ground);border:1px solid var(--line2)}
.opt{font:inherit;font-size:14px;font-weight:600;border:1px solid transparent;background:transparent;color:var(--ink2);border-radius:9px;padding:9px 12px;cursor:pointer;line-height:1.35;transition:background .12s,color .12s}
.opts:not(.seg) .opt{border-color:var(--line);background:var(--surface);color:var(--ink)}
.opt:hover{color:var(--ink);background:color-mix(in srgb,var(--surface) 70%,transparent)}
.opt[aria-pressed="true"]{background:var(--navy);color:var(--surface);border-color:var(--navy);box-shadow:0 2px 8px -3px rgba(20,28,51,.5)}
.opt.u[aria-pressed="true"]{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);box-shadow:none}
.opt.t[aria-pressed="true"]{background:var(--talk-bg);color:var(--talk);border-color:color-mix(in srgb,var(--talk) 40%,transparent);box-shadow:none}
.opt:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.sub{font-size:12.5px;color:var(--ink2);margin:14px 0 6px;font-weight:700;letter-spacing:.01em}
input[type=text],textarea,select{font:inherit;font-size:14.5px;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink)}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--navy) 14%,transparent)}
textarea{min-height:96px;resize:vertical}

/* 시간 고르기 */
.pick{display:flex;flex-direction:column;gap:8px}
.pick-row{border:1px solid var(--line2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px;background:var(--raise)}
.pick-days{display:flex;gap:4px}
.dchip{font:inherit;font-weight:700;font-size:14px;flex:1 1 0;min-width:0;max-width:52px;height:40px;padding:0;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.dchip.sat{color:#2f62c4} .dchip.sun{color:#c2412d}
.dchip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.pick-times{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pick-times select{width:auto;min-width:168px;flex:1}
.pick-times span{font-size:13px;color:var(--ink2)}
.pick-sum{font-size:13px;font-weight:600;color:var(--ok);background:var(--ok-bg);border-radius:8px;padding:8px 12px;line-height:1.6}
.pick-sum b{display:block;font-size:11.5px;letter-spacing:.04em;opacity:.8}
.pick-head{display:flex;align-items:center;gap:8px}
.pick-type{font-size:12px;font-weight:700;color:var(--navy);background:color-mix(in srgb,var(--navy) 9%,var(--surface));border-radius:6px;padding:2px 8px}
.pick-row.cli{background:repeating-linear-gradient(135deg,var(--raise) 0 8px,color-mix(in srgb,var(--brass) 6%,var(--raise)) 8px 16px)}
.pick-row.cli .pick-type{color:var(--brass);background:var(--brass-soft)}
.pick-del{margin-left:auto;font:inherit;font-size:12px;border:0;background:transparent;color:var(--ink3);cursor:pointer;text-decoration:underline}
.pick-add{display:flex;flex-wrap:wrap;gap:6px}
.sbtn.cli{border-color:color-mix(in srgb,var(--brass) 45%,var(--line));color:var(--brass)}
.pick-err{font-size:12.5px;color:var(--talk);font-weight:600}
.sbtn{font:inherit;font-size:12.5px;font-weight:600;border:1px dashed var(--line);background:transparent;color:var(--ink2);border-radius:9px;padding:6px 10px;cursor:pointer}
.sbtn:hover{border-color:var(--navy);color:var(--navy)}

/* 알림 */
.warn{margin-top:12px;background:var(--talk-bg);color:var(--talk);border-left:3px solid var(--talk);border-radius:4px 10px 10px 4px;padding:9px 12px;font-size:13px;line-height:1.55}
.warn[hidden]{display:none}
.warn b{display:block;margin-bottom:2px}
.warn .soft{color:var(--warn)} .warn.only-soft{background:var(--warn-bg);border-left-color:var(--warn)}

/* 카드 안 같은 요일 수업 목록 */
.dp{margin-top:12px;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:var(--raise);display:flex;flex-direction:column;gap:10px}
.dp-hint{margin:0;font-size:12.5px;color:var(--ink2)}
.dp-verdict{margin:0;font-size:13px;font-weight:700;line-height:1.5;border-radius:8px;padding:8px 10px}
.dp-verdict.v-hard{background:var(--talk-bg);color:var(--talk)} .dp-verdict.v-soft{background:var(--warn-bg);color:var(--warn)} .dp-verdict.v-ok{background:var(--ok-bg);color:var(--ok)}
.dp-day h4{margin:0 0 4px;font-size:12.5px;color:var(--ink2);cursor:default} .dp-day h4.sat{color:#2f62c4} .dp-day h4.sun{color:#c2412d}
.dp-day ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.dp-row{display:grid;grid-template-columns:96px 34px 1fr auto;gap:8px;align-items:center;min-height:32px;padding:4px 8px;border-radius:6px;background:var(--surface);border-left:3px solid transparent;font-size:13px}
.dp-row time{font-variant-numeric:tabular-nums;font-weight:600}
.dp-row .sj{font-size:12px;color:var(--ink2);font-weight:700}
.dp-row .nm{line-height:1.35} .dp-row .nm small{display:block;font-size:11.5px;font-weight:700}
.dp-row.me{background:color-mix(in srgb,var(--navy) 8%,var(--surface));border-left-color:var(--navy);font-weight:700}
.dp-row.hit{border-left-color:var(--talk)} .dp-row.hit .nm small{color:var(--talk)}
.dp-row.soft{border-left-color:var(--warn)} .dp-row.soft .nm small{color:var(--warn)}
.dp-row.exempt .nm small{color:var(--ink3);font-weight:500}
.dp-row.was{opacity:.6} .dp-row.was time{text-decoration:line-through}
.dp-none{font-size:12px;color:var(--ink3);padding:2px 8px}
.tg{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap}
.tg.fix{border:1px solid var(--ink3);color:var(--ink2)} .tg.tent{border:1px dashed var(--ink3);color:var(--ink2)} .tg.old{color:var(--ink3)} .tg.cli{border:1px solid var(--brass);color:var(--brass)}
@media (max-width:600px){.dp-row{grid-template-columns:86px 1fr auto;}.dp-row .sj{display:none}}
/* 월간 플래너 */
.pl-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pl-filter{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chipbtn{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;padding:4px 12px;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pl-band{margin-top:12px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;background:#efe9fb;color:#4a2f9a;border-left:4px solid #6d4bc4;border-radius:4px 12px 12px 4px;padding:10px 14px;font-size:14px}
.pl-band.open{background:#e3e7f2;color:#1a2747;border-left-color:#1a2747}
.pl-band.open b{background:#1a2747}
.pl-band b{font-size:12px;letter-spacing:.06em;background:#6d4bc4;color:#fff;border-radius:999px;padding:2px 9px}
.pl-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--ink2)}
.pl-legend span{display:inline-flex;align-items:center;gap:6px} .pl-legend i{width:14px;height:14px;border-radius:4px;background:var(--bg);border:1.5px solid var(--fg)}
.pl-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px;min-width:560px}
.pl-dow{text-align:center;font-size:12px;font-weight:700;color:var(--ink2);padding:4px 0} .pl-dow.sun{color:#c2412d} .pl-dow.sat{color:#2f62c4}
.pl-cell{min-height:92px;border:1px solid var(--line2);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:3px;background:var(--surface)}
.pl-cell.empty{background:transparent;border-color:transparent}
.pl-cell.today{border:2px solid var(--navy)}
.pl-d{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums} .pl-cell.red .pl-d{color:#c2412d} .pl-cell.blue .pl-d{color:#2f62c4}
.pl-holi{font-size:10.5px;color:#c2412d;font-weight:600}
.pl-ev{display:block;font-size:11px;font-weight:700;line-height:1.3;color:var(--fg);background:var(--bg);border-left:3px solid var(--fg);border-radius:3px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-ev.m,.pl-ev.e{border-left-style:dotted;opacity:.85}
.pl-more{font-size:10.5px;color:var(--ink3)}
.pl-list{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.pl-list li{display:grid;grid-template-columns:120px 1fr;gap:12px;border:1px solid var(--line2);border-left:4px solid var(--fg);border-radius:6px 12px 12px 6px;padding:10px 12px;background:var(--surface)}
.pl-when b{display:block;font-size:14px;font-variant-numeric:tabular-nums}

function h(tag, attrs, kids){
  const n = document.createElement(tag);
  for (const k in (attrs || {})){
    const v = attrs[k];
    if (k === "text") n.textContent = v; else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  (kids || []).forEach(c => c != null && n.append(c));
  return n;
}

  <p class="sec">일정은 학원이 먼저 정합니다</p>
  <p>선생님은 학원의 귀중한 파트너이고, 이 일을 함께하고 싶습니다. 그럼에도 과목끼리 시간이 겹치지 않게 하고, 학원 및 강사 공동의 매출을 극대화하고 이 지역 학생들이 실제로 다닐 수 있는 요일에 맞추기 위해 <b>학원이 일정을 먼저 정하고 그대로 진행하는 것을 원칙</b>으로 하겠습니다.</p>

    <li>이렇게 학원 일정상 한 과목을 맡는 선생님이 두 명이 되는 경우에도, 상담에서 특정 요일이나 선생님을 권하는 일은 일절 없습니다. 학생·학부모가 자기 스케줄에 맞게 직접 고릅니다.</li>

    const addCli = h("button",{type:"button", class:"sbtn cli", text:"+ 클리닉 추가"});
    addCli.onclick = () => { a.sched.push({type:"클리닉", days:[], start:"", end:""}); commit(); };
    box.append(h("div",{class:"pick-add"},[addReg, addCli]));
    const chk = schedCheck(a), sum = schedText(a);
    if (sum) box.append(h("div",{class:"pick-sum"},[h("b",{text:"입력된 시간"}), ...sum.split(" / ").map(x => { const m = x.match(/^(\S+) (\d\d):(\d\d)~(\d\d):(\d\d)( 클리닉)?$/);

/* ───── 학년별 주간 시간표 (실시간) ─────

const DAYS = ["월","화","수","목","금","토","일"];

const LAYER_NAME = {mine:"내 반", fixed:"확정", tent:"가안·조율 중", old:"2026 운영(참고)"};
function gridRows(rows){
  // 서버 plan27_grid 와 같은 규칙: 지원(opt)·조사 중·협의 사유·메모는 내보내지 않는다
  const out = {};

function hm(hh, mm){ let h = +hh; if (h >= 1 && h <= 8) h += 12; return h * 60 + (+(mm || 0)); }
function parseTimes(text){
  const out = []; let lastDays = [];
  String(text || "").replace(/요일/g, "").split(/[\/\n]| 또는 /).forEach(seg => {
    const t = seg.match(/(\d{1,2})(?::(\d{2}))?\s*[~\-–]\s*(\d{1,2})(?::(\d{2}))?/);
    if (!t) return;
    let head = seg.slice(0, seg.indexOf(t[0])).replace(/\d+\s*월/g, "");   // "12월부터" 의 월은 요일 아님
    let days = [];
    const range = head.match(/([월화수목금토일])\s*[~\-]\s*([월화수목금토일])/);
    if (range){ const i = DAYS.indexOf(range[1]), j = DAYS.indexOf(range[2]); if (i <= j) days = DAYS.slice(i, j + 1); }
    if (!days.length) days = [...head].filter(ch => DAYS.includes(ch));
    if (/주말/.test(head)) days = days.concat(["토","일"]);
    if (!days.length) days = lastDays;   // "토 11:00~13:00 또는 18:00~20:30" → 뒤쪽도 토
    if (!days.length) return;
    lastDays = days;
    const st = hm(t[1], t[2]), en = hm(t[3], t[4]);
    if (!(en > st)) return;
    const clinic = /클리닉|관리/.test(seg);
    [...new Set(days)].forEach(d => out.push({day:d, start:st, end:en, clinic}));
  });
  return out;
}
function courseSchool(c){
  const t = (c.course_name || "") + " " + (c.target_school || "");
  return /미강|미사강변/.test(t) ? "미사강변고" : /미사고/.test(t) ? "미사고" : /하남고/.test(t) ? "하남고" : /풍산/.test(t) ? "풍산고" : /청아/.test(t) ? "청아고" : null;
}
function courseKeys(c){
  const g = String(c.grade || ""), sch = c.subject === "수학" ? null : courseSchool(c);   // 수학은 학교 상관없이 그 학년 전체
  if (/수능/.test(g + (c.course_name || ""))) return ["수능"];
  const m = g.match(/(중|고)([123])/); if (!m) return [];
  if (m[1] === "중") return ["중" + m[2]];

const GRID_DATA = {courses:[], grid:[]};

function rowById(id){ for (const P of Object.values(PROFILES)) for (const g of P.groups) for (const r of g.rows) if (r.id === id) return {r, P}; return null; }
// 한 반의 실제 시간(고른 선택지 기준)
function rowTimes(r, a){

  if (r.kind === "opt") return c === "apply" ? parseTimes(a.time) : [];

function liveTimes(r, a){   // 다른 선생님 grid 값(시간만)

/* 학년 key 의 2027 블록. layer: mine / fixed / tent / old */
function blocksFor(key, me, mineRows, opts){
  const out = [], seen = new Set();
  const mathViewer = VIEW.subject === "수학", myP = PROFILES[VIEW.profile];
  const push = (bs, extra) => bs.forEach(b => out.push(Object.assign({}, b, extra)));
  // 1) 내 반
  Object.entries(mineRows || {}).forEach(([id, a]) => {
    const hit = rowById(id); if (!hit || !(ROW_GRADES[id] || []).includes(key)) return;
    const bs = rowTimes(hit.r, a); if (!bs.length) return;
    seen.add(id); push(bs, {layer:"mine", cid:id, subj:hit.P.subject, who:me, name:hit.r.name});
  });
  // 2) 다른 선생님이 확정한 시간 — 수학 선생님끼리는 서로 안 보임 / 다른 과목 선생님에게 수학은 가안(미정)

    const hit = rowById(id); if (!hit || seen.has(id) || !(ROW_GRADES[id] || []).includes(key)) return;
    if (mathViewer && hit.P.subject === "수학") return;
    const bs = liveTimes(hit.r, a); if (!bs.length) return;
    seen.add(id); push(bs, {layer: hit.P.subject === "수학" ? "tent" : "fixed", src:"teacher", cid:id, subj:hit.P.subject, who:t.teacher, name:hit.r.name});
  }));

  Object.values(PROFILES).forEach(P => P.groups.forEach(g => g.rows.forEach(r => {
    if (seen.has(r.id) || !(ROW_GRADES[r.id] || []).includes(key)) return;
    if (mathViewer && P.subject === "수학" && P !== myP) return;
    const bs = parseTimes(r.time); if (!bs.length) return;
    seen.add(r.id);
    // 국어(김영하) 가안: 본인에게는 '가안', 다른 선생님에게는 시간이 하나로 정해진 반은 '확정'
    const tent = r.kind === "plan" || (P.subject === "수학" ? !mathViewer : (r.kind === "survey" && (P === myP || !!r.slots)));
    const pk = Object.keys(PROFILES).find(k => PROFILES[k] === P);
    const owners = P.subject === "수학" || r.kind === "opt" ? [] : GRID_DATA.grid.filter(t => t.profile === pk).map(t => t.teacher);
    push(bs, {layer: tent ? "tent" : "fixed", src:"academy", cid:r.id, subj:P.subject, who: tent ? "학원 가안" : "학원 확정", owner: owners.length === 1 ? owners[0] : "", name:r.name});
  })));
  // 4) 2026 운영 시간표 — 2027 반이 없는 과목은 계속 쓰고(수학은 가안·미정으로), 있는 과목은 「겹쳐 보기」 때만

  const has27 = new Set(out.map(b => b.subj));

    const keep = !has27.has(c.subject);
    if (!keep && !(opts && opts.show2026)) return;
    const math = keep && c.subject === "수학" && !mathViewer;
    push(parseTimes(c.schedule_text), {layer: math ? "tent" : "old", carry:keep, cid:"now:" + c.course_name, subj:c.subject, who:c.teacher || "", name:c.course_name});
  });

}
/* 이 학년에서 아직 시간이 없는 반(예: 과학) — 시간표 아래 '시간 미정'으로 */
function undecidedFor(key, shown){
  const out = [];
  Object.entries(PROFILES).forEach(([pk, P]) => P.groups.forEach(g => g.rows.forEach(r => {
    if ((r.kind === "opt" && parseTimes(r.time).length) || !(ROW_GRADES[r.id] || []).includes(key) || shown.has(r.id)) return;
    if (VIEW.subject === "수학" && P.subject === "수학" && pk !== VIEW.profile) return;

function fmtHM(m){ return String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0"); }
const overlap = (m, b) => m.day === b.day && m.start < b.end && b.start < m.end;
/* 겹침 판정: hard = 학생이 두 과목을 같이 못 들음 / soft = 그 과목에 다른 시간대 반이 있음 / self = 내 다른 반과 겹침 */
function conflictsFor(r, a, subject, me, mineRows){

  function kpi(v, l){ return h("div",{class:"kpi"},[h("b",{text:v}), h("span",{text:l})]); }
  function nameOf(id){ for (const P of Object.values(PROFILES)) for (const g of P.groups) for (const r of g.rows) if (r.id === id) return r.name; return id; }
  function addForm(){
    const name = h("input",{type:"text", placeholder:"선생님 이름 (예: 과학 홍길동)"});
    const sel = h("select",{}, Object.entries(PROFILE_LABEL).map(([k,v]) => h("option",{value:k,text:v})));
    const btn = h("button",{class:"btn",type:"button",text:"링크 만들기"});
    btn.onclick = async () => { if (!name.value.trim()) return; btn.disabled = true; try { await store.add(key, name.value.trim(), sel.value); name.value = ""; await load(); } catch(e){ alert(e.message || "만들지 못했습니다."); } btn.disabled = false; };
    return h("div",{},[h("h3",{text:"선생님 링크 추가"}), h("div",{class:"addf"},[name, sel, btn])]);
  }
  await load();
  setInterval(() => { if (!document.hidden) load(); }, 30000);
}
