<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>다올105 — 학년 안내</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c1a36; --navy:#15294f; --gold:#c6a04a; --gold-b:#e7c56d; --gold-s:#f1e4bf;
    --cream:#faf6ee; --cream2:#f4ecdb; --paper:#fff;
    --text:#1b2440; --muted:#5a6480; --line:#e8dfc9; --danger:#c0392b; --ok:#2f7d4f;
    --serif:"Nanum Myeongjo",serif;
    --sans:"Pretendard","Malgun Gothic",system-ui,sans-serif;
    --c국어:#d9799f; --c영어:#4a72c6; --c수학:#d08036; --c과학:#7a5fc0;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);background:var(--cream);color:var(--text);line-height:1.75;font-size:16px;word-break:keep-all;-webkit-text-size-adjust:100%}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px}
  section{padding:34px 0}
  .paper{background:var(--paper)}

  /* HERO */
  .hero{background:radial-gradient(700px 380px at 80% -10%,rgba(231,197,109,.2),transparent 60%),linear-gradient(160deg,#0c1a36,#15294f 60%,#1b3160);color:#fff;padding:34px 0 30px}
  .hero .b{font-size:11px;font-weight:800;letter-spacing:.28em;color:var(--gold-b)}
  .hero h1{font-family:var(--serif);font-size:clamp(24px,6vw,34px);font-weight:800;margin:10px 0 8px;line-height:1.35}
  .hero p{margin:0;font-size:14.5px;color:#c3cee2}
  .hero .who{display:inline-block;margin-top:14px;background:rgba(231,197,109,.14);border:1px solid rgba(231,197,109,.42);border-radius:999px;padding:5px 15px;font-size:13.5px;font-weight:800;color:var(--gold-b)}

  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--gold);margin-bottom:12px}
  .eyebrow::before{content:"";width:24px;height:2px;background:var(--gold)}
  h2.sec{font-family:var(--serif);font-size:clamp(21px,4.6vw,29px);font-weight:800;color:var(--ink);margin:0 0 12px;line-height:1.4}
  h3.sub{font-family:var(--serif);font-size:clamp(17px,3.6vw,21px);font-weight:800;color:var(--ink);margin:22px 0 8px}
  .lead{font-size:14.5px;color:var(--muted);margin:0 0 14px;line-height:1.85}

  /* 요일 카드형 시간표 (모바일 우선) */
  .day{background:var(--paper);border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden;box-shadow:0 6px 18px -14px rgba(12,26,54,.4)}
  .day-h{display:flex;align-items:center;gap:9px;background:var(--cream2);padding:9px 14px;border-bottom:1px solid var(--line)}
  .day-h b{font-family:var(--serif);font-size:17px;color:var(--navy)}
  .day-h span{font-size:11.5px;color:var(--muted);margin-left:auto}
  .day-b{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .slot{display:flex;gap:10px;align-items:flex-start;border-left:4px solid #ccc;background:#fbfcfe;border-radius:9px;padding:9px 11px}
  .slot .tm{font-size:12.5px;font-weight:800;color:var(--navy);white-space:nowrap;min-width:96px}
  .slot .nm{font-size:14px;font-weight:800;color:var(--ink)}
  .slot .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
  .slot .tag{display:inline-block;font-size:10.5px;font-weight:800;border-radius:4px;padding:1px 7px;margin-left:5px;vertical-align:1px}
  .slot .tag.reg{background:var(--ink);color:#fff}
  .slot .tag.cli{background:#fff;color:var(--gold);border:1px solid var(--gold)}
  .day-empty{font-size:13px;color:#a9b0c0;padding:6px 2px}

  /* 주간 표(그리드) 시간표 — 학원 내부 시간표와 동일한 디자인 */
  .vsw{display:flex;gap:6px;margin:0 0 12px}
  .vsw button{flex:0 0 auto;font-family:inherit;font-size:13px;font-weight:800;border-radius:9px;padding:8px 16px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--muted)}
  .vsw button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .ghint{font-size:12px;color:var(--muted);margin:0 0 8px}
  .gsheet{background:#fff;border:1px solid var(--line);border-radius:13px;overflow-x:auto;-webkit-overflow-scrolling:touch;box-shadow:0 6px 18px -14px rgba(12,26,54,.4)}
  .gg-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 18px 6px}
  .gg-brand{font-size:12px;font-weight:800;color:var(--navy);letter-spacing:1px}
  .gg-title{text-align:center;flex:1}
  .gg-title .tt{font-size:12px;font-weight:800;letter-spacing:3px;color:var(--gold)}
  .gg-title .gn{font-family:var(--serif);font-size:26px;font-weight:800;color:var(--ink);margin-top:2px}
  .gg-note{max-width:300px;background:#fffbe8;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;font-size:11px;color:#78350f;line-height:1.45}
  .gg-note b{color:#b45309}
  .ggrid{display:grid;grid-template-columns:64px repeat(7,1fr);min-width:900px;padding:0 10px 12px}
  .gg-h{font-weight:800;font-size:13px;text-align:center;padding:9px 4px;border-bottom:2px solid #374151;background:#fdf6ec}
  .gg-h.wk,.gg-h.sat{color:#2563eb}.gg-h.sun{color:#dc2626}
  .gg-h.corner{background:transparent;border-bottom:2px solid #374151}
  .gg-col{position:relative;border-left:1px solid #eef0f3}
  .gg-col.last{border-right:1px solid #eef0f3}
  .gg-timecol{position:relative}
  .gg-tlabel{position:absolute;left:0;right:4px;text-align:right;font-size:10.5px;color:var(--muted);transform:translateY(-6px)}
  .gg-line{position:absolute;left:0;right:0;border-top:1px solid #eef0f3}
  .gblk{position:absolute;border-radius:8px;padding:5px 6px;font-size:11px;overflow:hidden;line-height:1.25;box-shadow:0 1px 2px rgba(0,0,0,.12);color:#111827}
  .gblk .gsch{font-size:10px;font-weight:700;color:#374151}
  .gblk .gteach{font-weight:800;color:#111827}
  .gblk .gsub{font-weight:800;font-size:12px}
  .gblk .gtag{display:inline-block;font-size:9px;font-weight:800;border-radius:3px;padding:0 4px;margin-left:2px;vertical-align:middle}
  .gblk .gtag.reg{background:#1d4ed8;color:#fff}
  .gblk .gtag.cli{background:#fff;color:#b45309;border:1px solid #f59e0b}
  .gblk .gtm{font-size:10px;color:#4b5563;margin-top:1px}
  .gblk .gdet{font-size:9.5px;color:#374151;margin-top:2px;line-height:1.3;border-top:1px dotted rgba(0,0,0,.18);padding-top:2px}
  .gblk .gbadges{margin-top:2px;display:flex;gap:3px;flex-wrap:wrap}
  .gunit{display:inline-block;font-size:10px;font-weight:800;color:#fff;border-radius:4px;padding:1px 6px}
  .gsp{display:inline-block;font-size:9.5px;font-weight:800;color:#7f1d1d;background:#fee2e2;border:1px solid #fca5a5;border-radius:4px;padding:0 4px}
  .gg-legend{display:flex;gap:14px;flex-wrap:wrap;padding:2px 18px 14px;font-size:11.5px;color:var(--muted)}
  .gg-legend .k{display:inline-flex;align-items:center;gap:5px}
  .gg-sw{width:16px;height:12px;border-radius:3px;display:inline-block}

  /* 과목 안내 */
  .subj{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 6px 18px -14px rgba(12,26,54,.4)}
  .subj-h{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .subj-h .dot{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--serif);font-weight:800;font-size:14px}
  .subj-h .nm{font-family:var(--serif);font-size:20px;font-weight:800;color:var(--ink)}
  .story{background:var(--cream);border:1px solid var(--line);border-radius:11px;padding:14px 15px;margin-bottom:11px}
  .story b.t{display:block;font-family:var(--serif);font-size:16px;color:var(--navy);margin-bottom:6px}
  .story p{margin:0;font-size:14px;line-height:1.85}
  .pull{margin-top:11px;background:#fff;border-left:4px solid var(--gold);border-radius:9px;padding:12px 14px}
  .pull b{display:block;font-family:var(--serif);font-size:15px;color:var(--navy);margin-bottom:5px}
  .pull span{font-size:13.5px;line-height:1.85}
  .tcard{display:flex;gap:12px;border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff;margin-bottom:10px}
  .tcard img{width:56px;height:72px;object-fit:contain;object-position:bottom;flex:0 0 auto}
  .tcard .n{font-family:var(--serif);font-size:16px;font-weight:800}
  .tcard .c{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.5}
  .tcard .q{font-size:13px;color:var(--gold);font-weight:800;margin:5px 0 6px}
  .tcard b.lb{display:block;font-size:11px;font-weight:800;color:var(--gold);margin-top:6px}
  .tcard ul{margin:2px 0 0;padding-left:17px}
  .tcard li{font-size:13px;line-height:1.7}
  .course{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:12px 14px;margin-top:10px;background:#fffdf9}
  .course .cn{font-family:var(--serif);font-size:16px;font-weight:800;color:var(--ink)}
  .course .ct{font-size:13px;color:var(--navy);font-weight:700;margin:4px 0 7px}
  .course b.lb{display:block;font-size:11px;font-weight:800;color:var(--gold);margin-top:7px}
  .course ul{margin:2px 0 0;padding-left:17px}
  .course li{font-size:13.5px;line-height:1.7}

  /* 중등영어 A/B */
  .ab{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .ab .card{border-radius:13px;padding:16px}
  .ab .a{background:#f2f7fd;border:1px solid #c7ddf7}
  .ab .b{background:#fffaf0;border:1px solid var(--gold-s)}
  .ab .tagline{display:inline-block;font-size:11px;font-weight:800;border-radius:5px;padding:2px 9px;color:#fff;margin-bottom:7px}
  .ab .a .tagline{background:#2b5ea8}.ab .b .tagline{background:#b8842c}
  .ab h4{font-size:15.5px;font-weight:800;margin:0 0 7px}
  .ab p{margin:0 0 8px;font-size:13.5px;line-height:1.8}
  .split{display:flex;height:26px;border-radius:6px;overflow:hidden;font-size:11px;font-weight:800;color:#fff;margin:8px 0 5px}
  .split .s70{flex:0 0 70%;background:#b8842c;display:flex;align-items:center;justify-content:center}
  .split .s30{flex:0 0 30%;background:var(--gold-s);color:#7c5a17;display:flex;align-items:center;justify-content:center}
  .alert{background:#fdf1f0;border:1px solid #f3cfcb;border-radius:9px;padding:10px 12px;margin-top:9px}
  .alert b{display:block;font-size:12px;color:var(--danger);margin-bottom:4px}
  .alert li{font-size:12.8px;line-height:1.7;color:#7a3b35}
  .alert ul{margin:0;padding-left:17px}
  .pact{margin-top:14px;border:1.5px solid var(--gold);border-radius:13px;background:#fffaf0;padding:16px}
  .pact h4{font-size:16px;font-weight:800;color:#8a5a12;margin:0 0 7px}
  .pact ol{margin:0;padding-left:19px}
  .pact li{font-size:13.5px;line-height:1.8;margin-bottom:5px}
  .seal{margin-top:11px;background:var(--ink);color:#fff;border-radius:9px;padding:12px 14px;font-size:13.5px;font-weight:700;line-height:1.75}
  .seal span{display:block;margin-top:4px;font-weight:400;font-size:12.5px;color:#c3cee2}
  .box{background:var(--cream);border:1px solid var(--line);border-radius:11px;padding:13px 15px;font-size:13.5px;line-height:1.8;margin-top:11px}
  .box.warn{background:#fdf1f0;border-color:#f3cfcb;color:#7a3b35}
  .box.key{background:#fffbeb;border-color:var(--gold-s);color:#7a5a12;font-weight:700}

  /* CTA */
  .cta{background:radial-gradient(600px 320px at 80% 0%,rgba(231,197,109,.18),transparent 60%),linear-gradient(160deg,#0c1a36,#15294f);color:#fff;text-align:center;padding:36px 0 40px}
  .cta h2{font-family:var(--serif);font-size:22px;margin:0 0 10px;color:#fff}
  .cta p{font-size:14px;color:#c3cee2;margin:0 auto 18px;max-width:460px}
  .cta a{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(180deg,var(--gold-b),var(--gold));color:var(--ink);text-decoration:none;font-weight:800;font-size:16px;border-radius:999px;padding:13px 32px}
  .foot{background:var(--ink);color:#7e8db0;text-align:center;font-size:11.5px;padding:16px 0 70px}
  .sticky{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:8px;padding:9px 11px;background:rgba(12,26,54,.96);backdrop-filter:blur(8px);border-top:1px solid rgba(231,197,109,.3)}
  .sticky a{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:800;padding:13px;border-radius:11px;font-size:15px;text-decoration:none;background:linear-gradient(180deg,var(--gold-b),var(--gold));color:var(--ink)}
  .empty{padding:70px 20px;text-align:center;color:var(--muted)}
  @media(max-width:640px){ .ab{grid-template-columns:1fr} .slot{flex-direction:column;gap:3px} .slot .tm{min-width:0} }
</style>

<div id="app"><div class="empty">불러오는 중…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="copy.js"></script>

<script>
const P=new URLSearchParams(location.search);
/* 문자(SMS)용 짧은 영문 별칭 — 한글 URL이 깨지는 문자앱 대비 (?g=m1 == ?g=중1) */
const GRADE_ALIAS={m1:"중1",m2:"중2",m3:"중3",h1:"미사고1",h2:"미사고2",h3:"고3",
  mg1:"미사강변고1",mg2:"미사강변고2",hn1:"하남고1"};
const GRADE=(g=>GRADE_ALIAS[g.toLowerCase()]||g)(P.get("g")||"중1");
/* 다올105 대표번호. 031-794-8158은 대치더올이므로 여기에 쓰면 안 된다. */
const TEL="031-699-8111";
const DAY_LIST=["월","화","수","목","금","토","일"];
const SUBJECT_ORDER=["국어","영어","수학","과학","사회","기타"];
const HIGH=["미사고","미사강변고","하남고","풍산고"];
const SC={국어:"#d9799f",영어:"#4a72c6",수학:"#d08036",과학:"#7a5fc0",사회:"#3f9e6a",기타:"#8b93a7"};
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const escA=s=>esc(s).replace(/"/g,"&quot;");
const fmt=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const bl=t=>String(t||"").split(/\n/).map(s=>s.replace(/^[-–—·•]\s*/,"").trim()).filter(Boolean);
const ggf=g=>(/고3|수능/.test(g||""))?"고3":g;
function courseSchool(c){
  const t=((c.target_school||"").trim()==="미강고")?"미사강변고":(c.target_school||"").trim();
  if(HIGH.includes(t)) return t;
  const n=c.course_name||"";
  if(/미사강변고|미강고/.test(n)) return "미사강변고";
  if(/미사고/.test(n)) return "미사고";
  if(/하남고/.test(n)) return "하남고";
  return null;
}
function extractDays(seg){
  const set=new Set();
  (seg.match(/[월화수목금토일]요일/g)||[]).forEach(m=>set.add(m[0]));
  (seg.match(/[월화수목금토일]{2,}/g)||[]).forEach(r=>{for(const ch of r) set.add(ch);});
  for(let i=0;i<seg.length;i++){const ch=seg[i];if("월화수목금토일".includes(ch)){const nx=seg[i+1]||"",pv=seg[i-1]||"";if(!/[가-힣]/.test(nx)&&!/[가-힣]/.test(pv)) set.add(ch);}}
  return [...set];
}
function korToMin(s){const m=String(s).match(/(오전|오후)\s*(\d{1,2})시(?:\s*(\d{1,2})분)?/);if(m){let h=(+m[2])%12;if(m[1]==="오후")h+=12;return h*60+(m[3]?+m[3]:0);}return null;}
function parseDayTimes(text){
  const out=[];
  String(text||"").split(/\n|\//).forEach(seg=>{
    seg=seg.trim(); if(!seg) return;
    const days=extractDays(seg); if(!days.length) return;
    const type=/클리닉/.test(seg)?"클리닉":(/관리/.test(seg)?"관리":"정규");
    let s=null,e=null;
    let m=seg.match(/(\d{1,2}):(\d{2})\s*[~\-–]\s*(\d{1,2}):(\d{2})/);
    if(m){s=(+m[1])*60+(+m[2]);e=(+m[3])*60+(+m[4]);}
    else{
      const p=seg.split(/[~\-–]/);
      if(p.length>=2){const a=korToMin(p[0]),b=korToMin(p[1]);if(a!=null&&b!=null){s=a;e=b;}}
      if(s==null){const m2=seg.match(/(\d{1,2}):(\d{2})/);if(m2)s=(+m2[1])*60+(+m2[2]);else{const a=korToMin(seg);if(a!=null)s=a;}if(s!=null)e=s+120;}
      if(s==null){const m3=seg.match(/(\d{1,2})\s*[-~]\s*(\d{1,2})\s*시/);if(m3){let h1=+m3[1],h2=+m3[2];if(h1<12)h1+=12;if(h2<12)h2+=12;s=h1*60;e=h2*60;}}
    }
    if(s==null) return;
    if(e==null||e<=s) e=s+120;
    days.forEach(d=>out.push({day:d,start:s,end:e,type}));
  });
  return out;
}
const cGrade=c=>{let g=ggf(c.grade);if(!g){const m=(c.course_name||"").match(/(중[123]|고[123]|수능)/);if(m)g=ggf(m[1]);}return g;};
function coursesForGrade(key,all){
  return all.filter(c=>{
    if(!(c.schedule_text||"").trim()) return false;
    if(/자습|써머스쿨|섬머스쿨|서머스쿨/.test(c.course_name||"")) return false;
    const g=cGrade(c),sub=c.subject,sch=courseSchool(c);
    if(["중1","중2","중3"].includes(key)) return g===key||g==="중등공통";
    if(key==="고3") return g==="고3";
    const wantG=key.endsWith("2")?"고2":"고1";
    if(g!==wantG) return false;
    if(sub==="수학") return true;
    if(key==="하남고1") return sub==="영어"?(sch===null||sch==="하남고"):sch===null;
    const ws=key.startsWith("미사강변고")?"미사강변고":"미사고";
    return sch===null||sch===ws;
  });
}
/* ===== 주간 표(그리드)용 — 학원 내부 시간표와 동일 규칙 ===== */
const SUBJ_COLOR={국어:"#fbcfe8",영어:"#bfdbfe",수학:"#fed7aa",과학:"#ddd6fe",사회:"#bbf7d0",기타:"#e5e7eb"};
const SUBJ_BORDER={국어:"#db2777",영어:"#2563eb",수학:"#ea580c",과학:"#7c3aed",사회:"#16a34a",기타:"#6b7280"};
const MATH_UNITS=[
  {re:/공통\s*수학\s*2|공수\s*2/, label:"공통수학2", color:"#6d28d9"},
  {re:/공통\s*수학\s*1|공수\s*1/, label:"공통수학1", color:"#1d4ed8"},
  {re:/확률과?\s*통계|확통/,      label:"확률과통계", color:"#047857"},

  {re:/기하/,                     label:"기하",       color:"#0e7490"},

];
function mathUnit(c){
  if(c.subject!=="수학") return null;
  const t=(c.course_name||"")+" "+(c.content||"");
  for(const u of MATH_UNITS) if(u.re.test(t)) return u;
  return null;
}
const isSpecial=c=>c.course_type==="특강"||/특강/.test(c.course_name||"")||/특강\s*회당/.test(c.tuition_note||"");
function courseEnd(c){
  if(c.end_date){ const d=new Date(c.end_date+"T23:59:59"); return isNaN(d)?null:d; }
  const t=(c.schedule_text||"")+" "+(c.tuition_note||""), Y=new Date().getFullYear();
  const r=t.match(/(\d{1,2})\s*\/\s*(\d{1,2})\s*[~\-–]\s*(\d{1,2})\s*\/\s*(\d{1,2})/);
  if(r){ const sm=+r[1],em=+r[3]; if(sm<1||sm>12||em<1||em>12) return null; return new Date(Y+(em<sm?1:0),em-1,+r[4],23,59,59); }
  const all=[...t.matchAll(/(\d{1,2})\s*\/\s*(\d{1,2})(?!\d)/g)].filter(m=>+m[1]>=1&&+m[1]<=12&&+m[2]>=1&&+m[2]<=31);
  if(all.length){ const F=all[0],L=all[all.length-1]; return new Date(Y+((+L[1])<(+F[1])?1:0),(+L[1])-1,+L[2],23,59,59); }
  return null;
}
/* 강사가 입력한 "요일·시간대별 진행 내용" 파싱 */
function notesFor(raw,day,start){
  if(!String(raw||"").trim()) return "";
  const hit=[],common=[];
  String(raw).split(/\n|\//).forEach(line=>{
    let s=line.trim(); if(!s) return;
    const tm=s.match(/(\d{1,2}):(\d{2})\s*[~\-–]\s*(\d{1,2}):(\d{2})/);
    let t0=null,t1=null;
    if(tm){ t0=(+tm[1])*60+(+tm[2]); t1=(+tm[3])*60+(+tm[4]); }
    const head=s.split(/[::]/)[0];
    const days=extractDays(head.length<=12?head:s.slice(0,12));
    let body=s.replace(/\d{1,2}:\d{2}\s*[~\-–]\s*\d{1,2}:\d{2}\s*/,"")
              .replace(/^\s*[^::\d]{0,12}[::]\s*/,"")
              .replace(/^\s*[월화수목금토일]{1,7}(요일)?\s+/,"").trim();
    if(!body) body=s.trim();
    const dayOK=days.length?days.includes(day):null;
    const timeOK=(t0!=null)?(start>=t0-1&&start<t1):null;
    if(dayOK===false||timeOK===false) return;
    if(dayOK===null&&timeOK===null) common.push(body); else hit.push(body);
  });
  return (hit.length?hit:common).join(" · ");
}
function layoutRoom(blks){
  blks.sort((a,b)=>a.start-b.start||a.end-b.end);
  const laneEnd=[];
  blks.forEach(b=>{ let i=0; for(;i<laneEnd.length;i++){ if(laneEnd[i]<=b.start) break; } b.lane=i; laneEnd[i]=b.end; });
  blks.forEach(b=>{ const grp=blks.filter(x=>x.start<b.end&&b.start<x.end); b.cols=Math.max(0,...grp.map(x=>x.lane))+1; });
}

    layoutRoom(blks);
    blks.forEach(b=>{

      const L=b.lane/b.cols*100,W=100/b.cols;

      html+=`<div class="gblk ${clinic?"clinic":""}" style="top:${top}px;height:${h}px;left:calc(${L}% + 2px);width:calc(${W}% - 4px);${box}">
        <div class="gsch">[${esc(grade)}]${b.teacher?` <span class="gteach">${esc(b.teacher)} T</span>`:""}</div>
        <div class="gsub">${esc(b.subj||"")}<span class="gtag ${clinic?"cli":"reg"}">${clinic?"관리(클리닉)":"수업"}</span></div>

  const subs=[...new Set(DAY_LIST.flatMap(d=>byDay[d].map(b=>b.subj)).filter(Boolean))];
  html+=`<div class="gg-legend">
    ${subs.map(s=>`<span class="k"><span class="gg-sw" style="background:${SUBJ_COLOR[s]||"#e5e7eb"}"></span>${esc(s)}</span>`).join("")}

  return html;
}

            · 자기주도 학습이 완성되어 스스로 복습이 가능한 학생<br>

            · 당장의 성적 상승보다 <b>과목 수업을 듣는 것 자체에 만족</b>하는 학생</p>
          <div class="alert"><b>반드시 먼저 알아두셔야 합니다</b>
            <ul>
              <li>이 방식은 <b>학생의 자기주도성을 전제로 설계된 커리큘럼</b>입니다. 스스로 복습·암기·오답 정리를 해내지 못하는 학생에게는 <b>성적 향상을 보장할 수 없습니다.</b></li>
              <li>이해도는 한 번에 무너지지 않습니다. <b>매주 아주 미세하게 조금씩</b> 밀리기 때문에, 문제를 알아차렸을 때는 이미 여러 단원이 지나가 있는 경우가 많습니다.</li>
              <li>주말 관리까지 함께 하는 학생들과는 <b>시간이 갈수록 격차가 벌어집니다.</b></li>
            </ul></div>
          <p style="margin-top:8px;color:#2b5ea8">그럼에도 관리일이 부담스러운 경우 <b>말씀만 주시면 빼 드립니다.</b> 억지로 끌고 가지 않습니다.</p>
        </div>
        <div class="card b"><span class="tagline">선택 B · 수업 + 관리 (권장)</span>
          <h4>주중 수업 + 금(토) 관리 클리닉</h4>
          <p>성적 향상 과정을 <b>학원에 위탁</b>하는 방식입니다.</p>
          <div class="split"><span class="s70">학원 책임 70%</span><span class="s30">학생 30%</span></div>
          <p style="font-size:12.8px;color:#7a5a12">성적은 학원 혼자 만들 수 없습니다. <b>학원이 70% 이상을 책임지고</b>, 나머지 <b>30%는 학생이 채워야</b> 완성됩니다.</p>
          <p style="color:#8a5a12"><b>학원이 책임지는 70%</b><br>
            · 주중 단어 재테스트 · 듣기<br>
            · 주중 어법/서술형/독해 <b>워크북 전면 재확인</b><br>
            · 상세 분석서를 주고 <b>학생이 직접 해석을 쓰고 단서를 찾도록</b> 유도<br>
            · 그 과정에서 <b>진짜 모르는 부분만 1:1 첨삭</b><br>
            · 주간 리포트로 <b>무엇이 되고 무엇이 안 되는지</b> 전달</p>
        </div>
      </div>

      <div class="pact">
        <h4>선택 B — 학생이 채워야 할 30%, 세 가지</h4>
        <p style="font-size:13.5px;margin:0 0 7px">관리는 학원이 끌고 가지만, <b>학생이 지켜주지 않으면 성립하지 않는 부분</b>이 있습니다.</p>
        <ol>
          <li><b>단어는 몰아서 외우지 않습니다.</b> 시험 직전에 한 번에 외우는 방식은 그 주만 넘길 뿐, 다음 주면 사라집니다.</li>
          <li><b>과제는 밀도 있게 해옵니다.</b> 빈칸만 채워오는 것이 아니라, <b>내가 무엇을 모르는지까지 표시해서</b> 가져와야 합니다.</li>
          <li><b>출석을 지킵니다.</b> 관리 수업은 <b>한 달 4회 중 최소 3회 이상</b> 참여해야 흐름이 끊기지 않습니다.</li>
        </ol>
        <div class="seal">이 세 가지(30%)가 지켜지면, 나머지 70%는 학원이 책임집니다. <b>1년 안에 성적을 끌어올리는 것을 학원이 보장하고 함께 갑니다.</b>
          <span>반대로 이 30%가 지켜지지 않으면 보장은 성립하지 않습니다. 그 시점에 솔직하게 말씀드리고, 무엇을 바꿔야 하는지 함께 조정합니다.</span></div>
      </div>

      <h3 class="sub">4. 관리(금·토)를 듣지 않을 경우 — 반드시 확인해 주세요</h3>
      <div class="box warn">
        관리 수업은 주중보다 <b>강도가 높습니다.</b> 주중에는 모르는 문제를 강사가 해설해 주지만, 관리일에는 학생이 스스로 해석을 쓰고 문제의 단서를 찾아야 하며 어휘도 다시 복습해야 합니다.
        그래서 <b>아직 마음의 준비가 되지 않은 학생</b>에게는 미수강을 허용합니다. 다만 아래는 반드시 감안해 주셔야 합니다.<br><br>
        · <b>선택 A는 자기주도성을 전제로 한 커리큘럼입니다.</b> 집에서 스스로 복습·암기·오답 정리를 해내지 못하는 학생에게는 <b>성적 향상을 보장할 수 없습니다.</b> 예외 없이 적용됩니다.<br>
        · 이해도는 <b>매주 미세하게 조금씩</b> 밀려, 문제를 알아차렸을 때는 이미 여러 단원이 지나가 있는 경우가 많습니다.<br>
        · 주말 관리까지 하는 학생들과 <b>시간이 갈수록 격차가 벌어집니다.</b><br>
        · 주간 리포트가 <b>개별 상황을 담기 어렵고</b>, 주중 단어 테스트 통과 여부 정도만 정리되어 나갑니다.<br>
        · 그 시점에 학원이 해 드릴 수 있는 부분이 제한됩니다.
      </div>

      <h3 class="sub">5. 가장 중요한 부분</h3>
      <div class="box key">성적은 <b>복습과 숙제를 집에서 실제로 해내는 학생</b>에게서만 오릅니다. 주도성이 매우 강한 학생이 아니라면, 수업은 들었지만 <b>점수는 오르지 않는</b> 경우가 대부분입니다. 이 점을 충분히 고려하여 선택해 주시기 바랍니다.</div>

      <h3 class="sub">6. 참고</h3>
      <div class="box">요일·시간·수강료 등 <b>수업 조건과 수강료는 선택 A/B에 관계없이 동일</b>합니다.</div>
    </div></section>`;
  }

  h+=`<section class="cta"><div class="wrap">
    <h2>궁금한 점은 언제든 문의해 주세요</h2>
    <p>수강 방식(선택 A / B) 회신도 아래 번호로 주시면 됩니다.</p>
    <a href="tel:${TEL.replace(/-/g,"")}">📞 ${TEL}</a>
  </div></section>
  <div class="foot">다올105 미사학원 · 경기 하남시 미사<br>본 안내는 ${esc(GRADE)} 기준으로 자동 생성되며, 수업 변경 시 자동으로 갱신됩니다.</div>
  <div class="sticky"><a href="tel:${TEL.replace(/-/g,"")}">📞 학원 문의 ${TEL}</a></div>`;

  document.getElementById("app").innerHTML=h;
  document.title=`다올105 ${GRADE} 시간표·수업 안내`;
  // 보기 전환 (주간 표 ↔ 요일별 카드)
  const sw=document.querySelector(".vsw");
  if(sw) sw.addEventListener("click",e=>{
    const b=e.target.closest("button[data-v]"); if(!b) return;
    sw.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
    const grid=b.dataset.v==="grid";
    document.getElementById("vGrid").style.display=grid?"":"none";
    document.getElementById("vCard").style.display=grid?"none":"";
  });
}
(async function(){
  const cfg=window.DAOL_CONFIG||{};
  if(!(cfg.url&&cfg.anonKey&&window.supabase)){ document.getElementById("app").innerHTML=`<div class="empty">연결 설정이 필요합니다.</div>`; return; }
  const sb=window.supabase.createClient(cfg.url,cfg.anonKey);
  const [{data:courses},{data:tt}]=await Promise.all([sb.from("courses").select("*"),sb.from("teachers").select("name,subject,photo_url,principle,strategy,intro,career")]);
  const teachers={}; (tt||[]).forEach(t=>teachers[t.name]=t);
  render(courses||[],teachers);
})();
</script>
</body>
</html>
